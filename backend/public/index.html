<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Kitchen Ops</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">

  <nav class="sidebar">
    <div class="brand">
      <div class="brand-title">KITCHEN OPS</div>
      <div class="brand-sub">Inventory Ticket System</div>
    </div>
    <ul class="nav-rail">
      <li><a href="index.html" class="active"><span class="dot">●</span> Dashboard</a></li>
      <li><a href="ingredients.html"><span class="dot">○</span> Ingredients</a></li>
      <li><a href="dishes.html"><span class="dot">○</span> Dishes</a></li>
      <li><a href="sales.html"><span class="dot">○</span> Sales</a></li>
    </ul>
  </nav>

  <main class="main">
    <div class="page-header">
      <div class="page-title">Dashboard</div>
      <div class="page-subtitle">Today's snapshot of the kitchen inventory.</div>
    </div>

    <div class="ticket-grid">
      <div class="ticket">
        <div class="ticket-label">Ingredients</div>
        <div class="ticket-value" id="stat-ingredients">—</div>
      </div>
      <div class="ticket">
        <div class="ticket-label">Dishes</div>
        <div class="ticket-value" id="stat-dishes">—</div>
      </div>
      <div class="ticket" id="stat-lowstock-ticket">
        <div class="ticket-label">Low stock alerts</div>
        <div class="ticket-value" id="stat-lowstock">—</div>
      </div>
    </div>

    <section class="section">
      <div class="section-title">Stock Alerts</div>
      <ul class="alert-list" id="alert-list">
        <li>Loading…</li>
      </ul>
    </section>
  </main>

</div>

<script>
async function loadDashboard() {
  const [ingredients, plats] = await Promise.all([
    fetch('/api/ingredients').then(r => r.json()),
    fetch('/api/plats').then(r => r.json()),
  ]);

  const lowStock = ingredients.filter(
    ing => parseFloat(ing.stock_actuel) <= parseFloat(ing.seuil_alerte)
  );

  document.querySelector('#stat-ingredients').textContent = ingredients.length;
  document.querySelector('#stat-dishes').textContent = plats.length;
  document.querySelector('#stat-lowstock').textContent = lowStock.length;

  const lowStockTicket = document.querySelector('#stat-lowstock-ticket');
  if (lowStock.length > 0) {
    lowStockTicket.classList.add('alert');
  }

  const list = document.querySelector('#alert-list');
  list.innerHTML = '';

  if (lowStock.length === 0) {
    list.innerHTML = '<li class="badge-ok">All ingredients are above their alert threshold ✓</li>';
    return;
  }

  lowStock.forEach(ing => {
    const li = document.createElement('li');
    li.innerHTML = `
      <span class="ing-name">${ing.nom}</span>
      <span class="ing-stock">${parseFloat(ing.stock_actuel).toFixed(2)} ${ing.unite} (threshold ${parseFloat(ing.seuil_alerte).toFixed(2)})</span>
    `;
    list.appendChild(li);
  });
}

loadDashboard();
</script>

</body>
</html>
