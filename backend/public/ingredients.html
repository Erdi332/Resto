<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingredients — Kitchen Ops</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">

  <nav class="sidebar">
    <div class="brand">
      <div class="brand-title">KITCHEN OPS</div>
      <div class="brand-sub">Inventory Ticket System</div>
    </div>
    <ul class="nav-rail">
      <li><a href="index.html"><span class="dot">○</span> Dashboard</a></li>
      <li><a href="ingredients.html" class="active"><span class="dot">●</span> Ingredients</a></li>
      <li><a href="dishes.html"><span class="dot">○</span> Dishes</a></li>
      <li><a href="sales.html"><span class="dot">○</span> Sales</a></li>
    </ul>
  </nav>

  <main class="main">
    <div class="page-header">
      <div class="page-title">Ingredients</div>
      <div class="page-subtitle">Current stock levels for every ingredient.</div>
    </div>

    <section class="section">
      <div class="section-title">Stock List</div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Stock</th>
              <th>Unit</th>
              <th>Alert threshold</th>
            </tr>
          </thead>
          <tbody id="table-ingredients">
            <tr class="empty-row"><td colspan="4">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="section">
      <div class="section-title">Add an Ingredient</div>
      <form id="form-ingredient" class="ticket-form">
        <div class="field">
          <label for="ing-nom">Name</label>
          <input type="text" id="ing-nom" required>
        </div>
        <div class="field">
          <label for="ing-unite">Unit</label>
          <input type="text" id="ing-unite" placeholder="kg, L, unit…" required>
        </div>
        <div class="field">
          <label for="ing-stock">Initial stock</label>
          <input type="number" step="0.01" id="ing-stock" value="0">
        </div>
        <div class="field">
          <label for="ing-seuil">Alert threshold</label>
          <input type="number" step="0.01" id="ing-seuil" value="0">
        </div>
        <div class="field field-submit">
          <label>&nbsp;</label>
          <button type="submit" class="btn">Add</button>
        </div>
      </form>
      <div id="message" class="form-message"></div>
    </section>
  </main>

</div>

<script>
async function loadIngredients() {
  const res = await fetch('/api/ingredients');
  const data = await res.json();
  const tbody = document.querySelector('#table-ingredients');
  tbody.innerHTML = '';

  if (data.length === 0) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="4">No ingredients yet.</td></tr>';
    return;
  }

  data.forEach(ing => {
    const low = parseFloat(ing.stock_actuel) <= parseFloat(ing.seuil_alerte);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${ing.nom}</td>
      <td class="num ${low ? 'low-stock' : ''}">${parseFloat(ing.stock_actuel).toFixed(2)}</td>
      <td>${ing.unite}</td>
      <td class="num">${parseFloat(ing.seuil_alerte).toFixed(2)}</td>
    `;
    tbody.appendChild(tr);
  });
}

document.querySelector('#form-ingredient').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.querySelector('#message');
  msg.textContent = '';
  msg.className = 'form-message';

  try {
    const res = await fetch('/api/ingredients', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nom: document.querySelector('#ing-nom').value,
        unite: document.querySelector('#ing-unite').value,
        stock_actuel: parseFloat(document.querySelector('#ing-stock').value) || 0,
        seuil_alerte: parseFloat(document.querySelector('#ing-seuil').value) || 0,
      }),
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error || 'Request failed');
    }

    e.target.reset();
    msg.textContent = 'Ingredient added.';
    msg.classList.add('success');
    loadIngredients();
  } catch (err) {
    msg.textContent = 'Error: ' + err.message;
    msg.classList.add('error');
  }
});

loadIngredients();
</script>

</body>
</html>
