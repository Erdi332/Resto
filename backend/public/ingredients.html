<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingredients — Kitchen Ops</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">

  <nav class="sidebar">
    <div class="brand">
      <div class="brand-title">Kitchen Ops</div>
      <div class="brand-sub">Inventory &amp; Menu Control</div>
    </div>
    <ul class="nav-rail">
      <li><a href="index.html"><span class="dot">01</span> Dashboard</a></li>
      <li><a href="ingredients.html" class="active"><span class="dot">02</span> Ingredients</a></li>
      <li><a href="dishes.html"><span class="dot">03</span> Dishes</a></li>
      <li><a href="sales.html"><span class="dot">04</span> Sales</a></li>
      <li><a href="purchases.html"><span class="dot">05</span> Purchases</a></li>
      <li><a href="stock-history.html"><span class="dot">06</span> Stock History</a></li>
    </ul>
  </nav>

  <main class="main">
    <div class="page-header">
      <div class="page-title">Ingredients</div>
      <div class="page-subtitle">Current stock levels for every ingredient.</div>
    </div>

    <section class="section">
      <div class="section-title">Stock List</div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Stock</th>
              <th>Unit</th>
              <th>Alert threshold</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="table-ingredients">
            <tr class="empty-row"><td colspan="5">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="section">
      <div class="section-title">Add an Ingredient</div>
      <form id="form-ingredient" class="form-grid">
        <div class="field">
          <label for="ing-nom">Name</label>
          <input type="text" id="ing-nom" required>
        </div>
        <div class="field">
          <label for="ing-unite">Unit</label>
          <input type="text" id="ing-unite" placeholder="kg, L, unit…" required>
        </div>
        <div class="field">
          <label for="ing-stock">Initial stock</label>
          <input type="number" step="0.01" id="ing-stock" value="0">
        </div>
        <div class="field">
          <label for="ing-seuil">Alert threshold</label>
          <input type="number" step="0.01" id="ing-seuil" value="0">
        </div>
        <div class="field field-submit">
          <label>&nbsp;</label>
          <button type="submit" class="btn">Add</button>
        </div>
      </form>
      <div id="message" class="form-message"></div>
    </section>
  </main>

</div>

<script>
let ingredientsData = [];

async function loadIngredients() {
  const res = await fetch('/api/ingredients');
  ingredientsData = await res.json();
  renderIngredients();
}

function renderIngredients() {
  const tbody = document.querySelector('#table-ingredients');
  tbody.innerHTML = '';

  if (ingredientsData.length === 0) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="5">No ingredients yet.</td></tr>';
    return;
  }

  ingredientsData.forEach(ing => {
    const low = parseFloat(ing.stock_actuel) <= parseFloat(ing.seuil_alerte);
    const tr = document.createElement('tr');
    tr.dataset.id = ing.id;
    tr.innerHTML = `
      <td>${ing.nom}</td>
      <td class="num ${low ? 'low-stock' : ''}">${parseFloat(ing.stock_actuel).toFixed(2)}</td>
      <td>${ing.unite}</td>
      <td class="num">${parseFloat(ing.seuil_alerte).toFixed(2)}</td>
      <td>
        <div class="row-actions">
          <button type="button" class="btn btn-ghost btn-small ing-edit">Edit</button>
          <button type="button" class="btn btn-secondary btn-small ing-adjust-toggle" data-id="${ing.id}">Adjust stock</button>
          <button type="button" class="btn btn-danger btn-small ing-delete">Delete</button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function renderAdjustForm(ing) {
  return `
    <form class="adjust-form" data-id="${ing.id}">
      <div class="field">
        <label for="adjust-qty-${ing.id}">New stock quantity</label>
        <input type="number" step="0.001" min="0" id="adjust-qty-${ing.id}" class="adjust-qty" value="${parseFloat(ing.stock_actuel)}" required>
      </div>
      <div class="field">
        <label for="adjust-motif-${ing.id}">Reason</label>
        <input type="text" id="adjust-motif-${ing.id}" class="adjust-motif" placeholder="Breakage, loss, physical count…" required>
      </div>
      <button type="submit" class="btn btn-small">Save adjustment</button>
      <button type="button" class="btn btn-ghost btn-small ing-adjust-cancel" data-id="${ing.id}">Cancel</button>
    </form>
  `;
}

function toggleAdjustRow(id) {
  const existing = document.querySelector(`tr.adjust-row[data-id="${id}"]`);
  if (existing) {
    existing.remove();
    return;
  }

  document.querySelectorAll('tr.adjust-row').forEach(row => row.remove());

  const ing = ingredientsData.find(i => String(i.id) === String(id));
  const platRow = document.querySelector(`#table-ingredients tr[data-id="${id}"]`);
  if (!platRow) return;

  const adjustRow = document.createElement('tr');
  adjustRow.className = 'adjust-row';
  adjustRow.dataset.id = id;
  adjustRow.innerHTML = `<td colspan="5">${renderAdjustForm(ing)}</td>`;
  platRow.after(adjustRow);
}

function startEdit(tr, ing) {
  tr.innerHTML = `
    <td><input type="text" class="edit-input" data-field="nom" value="${ing.nom}"></td>
    <td><input type="number" step="0.01" class="edit-input" data-field="stock_actuel" value="${parseFloat(ing.stock_actuel)}"></td>
    <td><input type="text" class="edit-input" data-field="unite" value="${ing.unite}"></td>
    <td><input type="number" step="0.01" class="edit-input" data-field="seuil_alerte" value="${parseFloat(ing.seuil_alerte)}"></td>
    <td>
      <div class="row-actions">
        <button type="button" class="btn btn-small ing-save">Save</button>
        <button type="button" class="btn btn-ghost btn-small ing-cancel">Cancel</button>
      </div>
    </td>
  `;
}

document.querySelector('#table-ingredients').addEventListener('click', async (e) => {
  if (e.target.classList.contains('ing-adjust-toggle') || e.target.classList.contains('ing-adjust-cancel')) {
    toggleAdjustRow(e.target.dataset.id);
    return;
  }

  const tr = e.target.closest('tr[data-id]');
  if (!tr || !tr.dataset.id || tr.classList.contains('adjust-row')) return;
  const id = tr.dataset.id;
  const ing = ingredientsData.find(i => String(i.id) === id);

  if (e.target.classList.contains('ing-edit')) {
    startEdit(tr, ing);
    return;
  }

  if (e.target.classList.contains('ing-cancel')) {
    renderIngredients();
    return;
  }

  if (e.target.classList.contains('ing-save')) {
    const payload = {};
    tr.querySelectorAll('.edit-input').forEach(input => {
      const field = input.dataset.field;
      payload[field] = (field === 'nom' || field === 'unite') ? input.value : parseFloat(input.value);
    });

    const res = await fetch(`/api/ingredients/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });

    if (!res.ok) {
      const err = await res.json();
      alert('Error: ' + err.error);
      return;
    }

    loadIngredients();
    return;
  }

  if (e.target.classList.contains('ing-delete')) {
    if (!confirm(`Delete "${ing.nom}"?`)) return;

    const res = await fetch(`/api/ingredients/${id}`, { method: 'DELETE' });
    if (!res.ok) {
      const err = await res.json();
      alert('Error: ' + err.error);
      return;
    }

    loadIngredients();
  }
});

document.querySelector('#table-ingredients').addEventListener('submit', async (e) => {
  const form = e.target.closest('.adjust-form');
  if (!form) return;
  e.preventDefault();

  const id = form.dataset.id;
  const quantite = parseFloat(form.querySelector('.adjust-qty').value);
  const motif = form.querySelector('.adjust-motif').value;

  const res = await fetch(`/api/ingredients/${id}/ajustement`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ quantite, motif }),
  });

  if (!res.ok) {
    const err = await res.json();
    alert('Error: ' + err.error);
    return;
  }

  loadIngredients();
});

document.querySelector('#form-ingredient').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.querySelector('#message');
  msg.textContent = '';
  msg.className = 'form-message';

  try {
    const res = await fetch('/api/ingredients', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nom: document.querySelector('#ing-nom').value,
        unite: document.querySelector('#ing-unite').value,
        stock_actuel: parseFloat(document.querySelector('#ing-stock').value) || 0,
        seuil_alerte: parseFloat(document.querySelector('#ing-seuil').value) || 0,
      }),
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error || 'Request failed');
    }

    e.target.reset();
    msg.textContent = 'Ingredient added.';
    msg.classList.add('success');
    loadIngredients();
  } catch (err) {
    msg.textContent = 'Error: ' + err.message;
    msg.classList.add('error');
  }
});

loadIngredients();
</script>

</body>
</html>
