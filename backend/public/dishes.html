<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dishes — Kitchen Ops</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">

  <nav class="sidebar">
    <div class="brand">
      <div class="brand-title">Kitchen Ops</div>
      <div class="brand-sub">Inventory &amp; Menu Control</div>
    </div>
    <ul class="nav-rail">
      <li><a href="index.html"><span class="dot">01</span> Dashboard</a></li>
      <li><a href="ingredients.html"><span class="dot">02</span> Ingredients</a></li>
      <li><a href="dishes.html" class="active"><span class="dot">03</span> Dishes</a></li>
      <li><a href="sales.html"><span class="dot">04</span> Sales</a></li>
      <li><a href="purchases.html"><span class="dot">05</span> Purchases</a></li>
      <li><a href="stock-history.html"><span class="dot">06</span> Stock History</a></li>
    </ul>
  </nav>

  <main class="main">
    <div class="page-header">
      <div class="page-title">Dishes</div>
      <div class="page-subtitle">The menu — every dish that can be sold, and the ingredients each one needs.</div>
    </div>

    <section class="section">
      <div class="section-title">Menu</div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Price</th>
              <th>Recipe</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="table-plats">
            <tr class="empty-row"><td colspan="4">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="section">
      <div class="section-title">Add a Dish</div>
      <form id="form-plat" class="form-grid">
        <div class="field">
          <label for="plat-nom">Name</label>
          <input type="text" id="plat-nom" required>
        </div>
        <div class="field">
          <label for="plat-prix">Price</label>
          <input type="number" step="0.01" min="0" id="plat-prix" required>
        </div>

        <div class="recipe-builder">
          <label class="recipe-builder-label">Recipe — ingredients needed</label>
          <div id="recipe-lines"></div>
          <button type="button" id="add-recipe-line" class="btn btn-secondary btn-small">+ Add ingredient</button>
        </div>

        <div class="field field-submit">
          <label>&nbsp;</label>
          <button type="submit" class="btn">Add Dish</button>
        </div>
      </form>
      <div id="message" class="form-message"></div>
    </section>
  </main>

</div>

<script>
let ingredientsCache = [];
let platsData = [];

async function loadIngredientsCache() {
  const res = await fetch('/api/ingredients');
  ingredientsCache = await res.json();
}

function ingredientOptionsHtml() {
  if (ingredientsCache.length === 0) {
    return '<option value="">No ingredients yet</option>';
  }
  return ingredientsCache
    .map(ing => `<option value="${ing.id}">${ing.nom} (${ing.unite})</option>`)
    .join('');
}

function addRecipeLine() {
  const row = document.createElement('div');
  row.className = 'recipe-line';
  row.innerHTML = `
    <select class="recipe-ingredient">${ingredientOptionsHtml()}</select>
    <input type="number" step="0.001" min="0" class="recipe-qty" placeholder="Quantity needed">
    <button type="button" class="recipe-remove" title="Remove">✕</button>
  `;
  row.querySelector('.recipe-remove').addEventListener('click', () => row.remove());
  document.querySelector('#recipe-lines').appendChild(row);
}

document.querySelector('#add-recipe-line').addEventListener('click', addRecipeLine);

async function loadDishes() {
  const res = await fetch('/api/plats');
  platsData = await res.json();
  renderDishes();
}

function renderDishes() {
  const tbody = document.querySelector('#table-plats');
  tbody.innerHTML = '';

  if (platsData.length === 0) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="4">No dishes yet.</td></tr>';
    return;
  }

  platsData.forEach(plat => {
    const tr = document.createElement('tr');
    tr.dataset.platId = plat.id;
    tr.innerHTML = `
      <td class="plat-nom">${plat.nom}</td>
      <td class="num plat-prix">$${parseFloat(plat.prix).toFixed(2)}</td>
      <td><button type="button" class="recipe-toggle" data-plat-id="${plat.id}">View recipe</button></td>
      <td>
        <div class="row-actions">
          <button type="button" class="btn btn-ghost btn-small plat-edit">Edit</button>
          <button type="button" class="btn btn-danger btn-small plat-delete">Delete</button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function startEditDish(tr, plat) {
  tr.innerHTML = `
    <td><input type="text" class="edit-input" data-field="nom" value="${plat.nom}"></td>
    <td><input type="number" step="0.01" min="0" class="edit-input" data-field="prix" value="${parseFloat(plat.prix)}"></td>
    <td class="num">—</td>
    <td>
      <div class="row-actions">
        <button type="button" class="btn btn-small plat-save">Save</button>
        <button type="button" class="btn btn-ghost btn-small plat-cancel">Cancel</button>
      </div>
    </td>
  `;
}

async function loadRecetteRows(platId) {
  const res = await fetch(`/api/plats/${platId}/recette`);
  return res.json();
}

function renderRecetteDetail(platId, lignes) {
  const listHtml = lignes.length
    ? `<ul class="recipe-detail-list">${lignes.map(l => `
        <li data-recette-id="${l.id}">
          <span>${l.ingredient_nom}</span>
          <input type="number" step="0.001" min="0" class="recipe-line-qty" value="${parseFloat(l.quantite_necessaire)}">
          <span>${l.ingredient_unite}</span>
          <button type="button" class="btn btn-ghost btn-small recipe-line-save" data-recette-id="${l.id}" data-plat-id="${platId}">Save</button>
          <button type="button" class="btn btn-danger btn-small recipe-line-remove" data-recette-id="${l.id}" data-plat-id="${platId}">Remove</button>
        </li>
      `).join('')}</ul>`
    : '<div class="recipe-detail-empty">No ingredients linked to this dish yet.</div>';

  return `
    ${listHtml}
    <form class="recipe-add-line" data-plat-id="${platId}">
      <select class="recipe-add-ingredient">${ingredientOptionsHtml()}</select>
      <input type="number" step="0.001" min="0" class="recipe-add-qty" placeholder="Quantity needed" required>
      <button type="submit" class="btn btn-secondary btn-small">Add to recipe</button>
    </form>
  `;
}

async function refreshRecetteDetail(platId) {
  const lignes = await loadRecetteRows(platId);
  const cell = document.querySelector(`tr.recipe-detail-row[data-plat-id="${platId}"] td`);
  if (cell) cell.innerHTML = renderRecetteDetail(platId, lignes);
}

async function toggleRecetteRow(platId, toggleBtn) {
  const existing = document.querySelector(`tr.recipe-detail-row[data-plat-id="${platId}"]`);
  if (existing) {
    existing.remove();
    toggleBtn.textContent = 'View recipe';
    return;
  }

  document.querySelectorAll('tr.recipe-detail-row').forEach(row => row.remove());
  document.querySelectorAll('.recipe-toggle').forEach(btn => btn.textContent = 'View recipe');

  toggleBtn.textContent = 'Hide recipe';
  const lignes = await loadRecetteRows(platId);

  const platRow = document.querySelector(`#table-plats tr[data-plat-id="${platId}"]`);
  const detailRow = document.createElement('tr');
  detailRow.className = 'recipe-detail-row';
  detailRow.dataset.platId = platId;
  detailRow.innerHTML = `<td colspan="4">${renderRecetteDetail(platId, lignes)}</td>`;
  platRow.after(detailRow);
}

document.querySelector('#table-plats').addEventListener('click', async (e) => {
  const toggleBtn = e.target.closest('.recipe-toggle');
  if (toggleBtn) {
    toggleRecetteRow(toggleBtn.dataset.platId, toggleBtn);
    return;
  }

  const tr = e.target.closest('tr[data-plat-id]');
  if (tr && !e.target.closest('.recipe-detail-row')) {
    const platId = tr.dataset.platId;
    const plat = platsData.find(p => String(p.id) === platId);

    if (e.target.classList.contains('plat-edit')) {
      startEditDish(tr, plat);
      return;
    }

    if (e.target.classList.contains('plat-cancel')) {
      renderDishes();
      return;
    }

    if (e.target.classList.contains('plat-save')) {
      const payload = {};
      tr.querySelectorAll('.edit-input').forEach(input => {
        const field = input.dataset.field;
        payload[field] = field === 'nom' ? input.value : parseFloat(input.value);
      });

      const res = await fetch(`/api/plats/${platId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      if (!res.ok) {
        const err = await res.json();
        alert('Error: ' + err.error);
        return;
      }

      loadDishes();
      return;
    }

    if (e.target.classList.contains('plat-delete')) {
      if (!confirm(`Delete "${plat.nom}"?`)) return;

      const res = await fetch(`/api/plats/${platId}`, { method: 'DELETE' });
      if (!res.ok) {
        const err = await res.json();
        alert('Error: ' + err.error);
        return;
      }

      loadDishes();
      return;
    }
  }

  const saveLineBtn = e.target.closest('.recipe-line-save');
  if (saveLineBtn) {
    const li = saveLineBtn.closest('li');
    const qty = parseFloat(li.querySelector('.recipe-line-qty').value);
    await fetch(`/api/recette/${saveLineBtn.dataset.recetteId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ quantite_necessaire: qty }),
    });
    refreshRecetteDetail(saveLineBtn.dataset.platId);
    return;
  }

  const removeBtn = e.target.closest('.recipe-line-remove');
  if (removeBtn) {
    await fetch(`/api/recette/${removeBtn.dataset.recetteId}`, { method: 'DELETE' });
    refreshRecetteDetail(removeBtn.dataset.platId);
  }
});

document.querySelector('#table-plats').addEventListener('submit', async (e) => {
  const form = e.target.closest('.recipe-add-line');
  if (!form) return;
  e.preventDefault();

  const platId = form.dataset.platId;
  const ingredientId = form.querySelector('.recipe-add-ingredient').value;
  const qty = parseFloat(form.querySelector('.recipe-add-qty').value);

  if (!ingredientId || !qty) return;

  await fetch(`/api/plats/${platId}/recette`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ingredient_id: parseInt(ingredientId), quantite_necessaire: qty }),
  });

  refreshRecetteDetail(platId);
});

document.querySelector('#form-plat').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.querySelector('#message');
  msg.textContent = '';
  msg.className = 'form-message';

  const ingredients = Array.from(document.querySelectorAll('#recipe-lines .recipe-line'))
    .map(row => ({
      ingredient_id: parseInt(row.querySelector('.recipe-ingredient').value),
      quantite_necessaire: parseFloat(row.querySelector('.recipe-qty').value),
    }))
    .filter(l => l.ingredient_id && l.quantite_necessaire > 0);

  try {
    const res = await fetch('/api/plats', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nom: document.querySelector('#plat-nom').value,
        prix: parseFloat(document.querySelector('#plat-prix').value),
        ingredients,
      }),
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error || 'Request failed');
    }

    e.target.reset();
    document.querySelector('#recipe-lines').innerHTML = '';
    msg.textContent = 'Dish added.';
    msg.classList.add('success');
    loadDishes();
  } catch (err) {
    msg.textContent = 'Error: ' + err.message;
    msg.classList.add('error');
  }
});

(async function init() {
  await loadIngredientsCache();
  addRecipeLine();
  loadDishes();
})();
</script>

</body>
</html>
