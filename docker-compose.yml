services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: monuser
      POSTGRES_PASSWORD: monmotdepasse
      POSTGRES_DB: mon_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgres://monuser:monmotdepasse@db:5432/mon_app

volumes:
  pgdata: